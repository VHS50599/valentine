<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
  }

  body {
    background:
      radial-gradient(circle at 70% 75%, rgba(255,255,255,0.18), transparent 45%),
      radial-gradient(circle at 50% 60%, #d8b4ff 0%, #a46bf5 35%, #6a2fc2 100%);
    font-family: Arial, sans-serif;
    text-align: center;
    position: relative;
    min-height: 100vh;
    transition: box-shadow 0.4s ease;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 150px rgba(0,0,0,0.3);
    z-index: 20;
  }

  .blob {
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    filter: blur(100px);
    top: 20%;
    left: 10%;
    animation: float 14s infinite ease-in-out;
    z-index: 0;
    will-change: transform;
  }

  .blob2 {
    top: 65%;
    left: 65%;
    animation-delay: 6s;
  }

  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-60px); }
    100% { transform: translateY(0px); }
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
    margin: 20px 0;
    text-shadow: 0 0 12px rgba(255,255,255,0.5);
  }

  h1 {
    font-size: clamp(28px, 8vw, 50px);
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(255,255,255,0.7);
  }

  p {
    font-size: clamp(18px, 5vw, 30px);
  }

  .heart {
    position: absolute;
    color: white;
    user-select: none;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 2;
    will-change: transform, opacity;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%) scale(0.3) rotate(-10deg);
    opacity: 0;
    transition: transform 1.5s cubic-bezier(.68,-0.55,.27,1.55), opacity 1.5s ease;
    z-index: 5;
    width: 400px;
  }

  .sparkle, .background-sparkle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(2px);
    will-change: transform, opacity;
  }

  .background-sparkle {
    z-index: 1;
    background: rgba(255,255,255,0.8);
    animation-name: bgSparkleMove;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  .sparkle {
    width: 5px;
    height: 5px;
    background: rgba(255,255,255,0.9);
    z-index: 6;
  }

  @keyframes bgSparkleMove {
    0% { transform: translate(0,0); opacity: 0.3; }
    100% { transform: translate(30px, 30px); opacity: 0.7; }
  }
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob blob2"></div>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png" alt="Bouquet">

<script>
// Hearts
const numHearts = 150;
const hearts = [];
const heartPositions = [];
const heartSizes = [];
let forming = false;

// Background sparkles (200 sparkles, CSS animated)
const bgSparkles = [];
for(let i=0; i<200; i++) {
  const s = document.createElement("div");
  s.className = "background-sparkle";
  const size = 2 + Math.random()*4;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.left = Math.random() * window.innerWidth + "px";
  s.style.top = Math.random() * window.innerHeight + "px";
  s.style.animationDuration = (4 + Math.random() * 3) + "s";
  s.style.animationDirection = Math.random() > 0.5 ? "alternate" : "alternate-reverse";
  document.body.appendChild(s);
  bgSparkles.push(s);
}

// Heart helpers
function getTextRects() {
  return Array.from(document.querySelectorAll('h1,p')).map(el => el.getBoundingClientRect());
}
function isOverlapping(x1,y1,r1,x2,y2,r2){
  return Math.sqrt((x1-x2)**2+(y1-y2)**2) < r1 + r2;
}
function overlapsText(x,y,r,textRects){
  return textRects.some(rect => {
    const cx = Math.max(rect.left, Math.min(x, rect.right));
    const cy = Math.max(rect.top, Math.min(y, rect.bottom));
    return Math.sqrt((x - cx)**2 + (y - cy)**2) < r;
  });
}
function getNonOverlappingPosition(radius, textRects){
  for(let attempt=0; attempt<200; attempt++){
    const x = Math.random() * (window.innerWidth - 2 * radius) + radius;
    const y = Math.random() * (window.innerHeight - 2 * radius) + radius;
    if(!overlapsText(x, y, radius, textRects) && !heartPositions.some((p, i) => isOverlapping(x, y, radius, p.x, p.y, heartSizes[i]))) {
      return {x, y};
    }
  }
  return {x: window.innerWidth / 2, y: window.innerHeight / 2};
}

// Create hearts
for(let i=0; i<numHearts; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";
  const size = 15 + Math.random() * 25;
  heart.style.fontSize = size + "px";
  const radius = size * 0.6;
  document.body.appendChild(heart);
  hearts.push(heart);
  heartSizes.push(radius);
  heartPositions.push({x: 0, y: 0});
}

// Animate hearts using a centralized requestAnimationFrame loop (replace setTimeouts)
const heartState = hearts.map(() => ({ visible: false, nextChange: 0 }));

function animateHearts(timestamp = 0) {
  const textRects = getTextRects();
  for(let i = 0; i < numHearts; i++) {
    if(!heartState[i].nextChange) heartState[i].nextChange = timestamp + Math.random() * 1000;

    if(timestamp >= heartState[i].nextChange) {
      const heart = hearts[i];
      const radius = heartSizes[i];

      if(heartState[i].visible) {
        // Hide heart
        heart.style.opacity = 0;
        heartState[i].visible = false;
        heartState[i].nextChange = timestamp + 300 + Math.random() * 700;
      } else {
        // Show heart at a non-overlapping position
        const pos = getNonOverlappingPosition(radius, textRects);
        heartPositions[i] = pos;
        // Use GPU accelerated transform
        heart.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
        heart.style.opacity = 1;
        heartState[i].visible = true;
        heartState[i].nextChange = timestamp + 800 + Math.random() * 700;
      }
    }
  }
  requestAnimationFrame(animateHearts);
}
requestAnimationFrame(animateHearts);

// Click event: bouquet + sparkles
document.addEventListener("click", () => {
  if(forming) return;
  forming = true;

  document.body.style.boxShadow = "inset 0 0 400px 80px rgba(255,255,255,0.4), 0 0 150px rgba(255,255,255,0.15)";
  setTimeout(() => document.body.style.boxShadow = "none", 800);

  setTimeout(() => {
    const bouquet = document.getElementById("bouquet");
    bouquet.style.opacity = 1;
    bouquet.style.transform = "translate(-50%, -50%) scale(1) rotate(0deg)";

    const rect = bouquet.getBoundingClientRect();
    for(let i=0; i<40; i++) {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      document.body.appendChild(sparkle);
      const size = 2 + Math.random() * 5;
      sparkle.style.width = sparkle.style.height = size + "px";
      sparkle.style.left = (rect.left + rect.width / 2) + "px";
      sparkle.style.top = (rect.top + rect.height / 2) + "px";

      const angle = Math.random() * 2 * Math.PI;
      const dist = 80 + Math.random() * 70;
      const endX = Math.cos(angle) * dist;
      const endY = Math.sin(angle) * dist;

      sparkle.style.opacity = 0.5 + Math.random() * 0.5;
      sparkle.style.transition = "transform 1.2s ease-out, opacity 1.2s ease-out";
      setTimeout(() => {
        sparkle.style.transform = `translate3d(${endX}px, ${endY}px, 0)`;
        sparkle.style.opacity = 0;
      }, 50);
      setTimeout(() => sparkle.remove(), 1300);
    }
  }, 900);
});
</script>
</body>
</html>
