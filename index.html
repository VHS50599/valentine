<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
}
body {
  background:
    radial-gradient(circle at 70% 75%, rgba(255,255,255,0.18), transparent 45%),
    radial-gradient(circle at 50% 60%, #d8b4ff 0%, #a46bf5 35%, #6a2fc2 100%);
  font-family: Arial, sans-serif;
  text-align: center;
  position: relative;
  min-height: 100vh;
}
.blob {
  position: absolute;
  width: 500px;
  height: 500px;
  background: rgba(255,255,255,0.07);
  border-radius: 50%;
  filter: blur(100px);
  top: 20%;
  left: 10%;
  animation: float 14s infinite ease-in-out;
  z-index: 0;
}
.blob2 {
  top: 65%;
  left: 65%;
  animation-delay: 6s;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-60px); }
  100% { transform: translateY(0px); }
}
h1, p {
  color: white;
  z-index: 10;
  position: relative;
  margin: 20px 0;
  text-shadow: 0 0 12px rgba(255,255,255,0.5);
}
h1 {
  font-size: clamp(28px, 8vw, 50px);
  letter-spacing: 2px;
  text-shadow: 0 0 18px rgba(255,255,255,0.7);
}
p {
  font-size: clamp(18px, 5vw, 30px);
}
.heart {
  position: absolute;
  color: white;
  user-select: none;
  pointer-events: none;
  z-index: 2;
  transition: transform 2.5s ease-in-out, opacity 0.4s ease;
}
#bouquet {
  position: fixed;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 5;
  width: 400px;
}
.sparkle, .background-sparkle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(2px);
  transition: width 0.8s ease, height 0.8s ease, transform 2s ease-in-out, opacity 0.5s ease;
}
.background-sparkle {
  z-index: 1;
  background: rgba(255,255,255,0.8);
}
.sparkle {
  width: 5px;
  height: 5px;
  background: rgba(255,255,255,0.9);
  z-index: 6;
}
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob blob2"></div>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png" alt="Bouquet">

<script>
const numHearts = 45; // +10 hearts
const hearts = [];
let forming = false;

/* BACKGROUND SPARKLES */
const bgSparkles = [];
for(let i=0;i<100;i++){
  const s=document.createElement("div");
  s.className="background-sparkle";
  const size = 2 + Math.random()*4;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.left = Math.random()*window.innerWidth + "px";
  s.style.top = Math.random()*window.innerHeight + "px";
  s.style.opacity = Math.random()*0.5 + 0.2;
  document.body.appendChild(s);
  bgSparkles.push(s);
}
function animateBgSparkle(s){
  const duration = 4000 + Math.random()*3000;
  const dx = (Math.random()-0.5)*50;
  const dy = (Math.random()-0.5)*50;
  s.style.transform = `translate(${dx}px, ${dy}px)`;
  s.style.opacity = Math.random()*0.5 + 0.2;
  setTimeout(()=>animateBgSparkle(s), duration);
}
bgSparkles.forEach(s=>animateBgSparkle(s));

/* HEART LOGIC */
const minY = window.innerHeight*0.15;
const maxY = window.innerHeight*0.85;

function getTextRects(){
  return Array.from(document.querySelectorAll('h1,p'))
    .map(el=>el.getBoundingClientRect());
}
function isOverlapping(x1,y1,r1,x2,y2,r2){
  return Math.sqrt((x1-x2)**2 + (y1-y2)**2) < r1+r2;
}
function overlapsText(x,y,r,textRects){
  return textRects.some(rect =>
    Math.sqrt(
      (x-Math.max(rect.left,Math.min(x,rect.right)))**2 +
      (y-Math.max(rect.top,Math.min(y,rect.bottom)))**2
    ) < r
  );
}

for(let i=0;i<numHearts;i++){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";

  // New refined size range (16px–32px)
  const fontSize = 16 + Math.random()*16;
  const radius = fontSize * 0.6;

  const textRects = getTextRects();
  let x=0,y=0;

  for(let attempt=0; attempt<200; attempt++){
    x = Math.random()*(window.innerWidth-2*radius)+radius;
    y = minY + Math.random()*(maxY-minY);
    if(!overlapsText(x,y,radius,textRects) &&
       !hearts.some(h=>isOverlapping(x,y,radius,h.x,h.y,h.radius))) break;
  }

  heart.style.left = x+"px";
  heart.style.top = y+"px";
  heart.style.fontSize = fontSize+"px";
  heart.style.opacity = 1;

  document.body.appendChild(heart);
  hearts.push({el:heart,x:x,y:y,radius:radius});
}

// Gentle floating
hearts.forEach(h=>{
  function float(){
    if(h.el.style.display === "none") return;
    const dx = (Math.random()-0.5)*20;
    const dy = (Math.random()-0.5)*20;
    h.el.style.transform = `translate(${dx}px, ${dy}px)`;
    setTimeout(float, 2500 + Math.random()*2000);
  }
  float();
});

/* CLICK EVENT */
document.addEventListener("click", ()=>{
  if(forming) return;
  forming = true;

  const bouquet = document.getElementById("bouquet");
  bouquet.style.opacity = 1;

  hearts.forEach(h=>{
    h.el.style.opacity = 0;
    setTimeout(()=>h.el.remove(),400);
  });

  bgSparkles.forEach(s=>{
    s.style.width = parseFloat(s.style.width)*2 + "px";
    s.style.height = parseFloat(s.style.height)*2 + "px";
  });

  const rect = bouquet.getBoundingClientRect();
  for(let i=0;i<40;i++){
    const sparkle=document.createElement("div");
    sparkle.className="sparkle";
    document.body.appendChild(sparkle);

    sparkle.style.width = sparkle.style.height = (3+Math.random()*6)+"px";
    sparkle.style.left=(rect.left + rect.width/2)+"px";
    sparkle.style.top=(rect.top + rect.height/2)+"px";

    const angle=Math.random()*2*Math.PI;
    const dist=80+Math.random()*70;
    const endX=Math.cos(angle)*dist;
    const endY=Math.sin(angle)*dist;

    sparkle.style.opacity = Math.random()*0.6 + 0.4;
    sparkle.style.transition="transform 1.2s ease-out, opacity 1.2s ease-out";

    setTimeout(()=>{
      sparkle.style.transform=`translate(${endX}px,${endY}px)`;
      sparkle.style.opacity=0;
    },50);

    setTimeout(()=>sparkle.remove(),1300);
  }
});
</script>
</body>
</html>
