<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }

  /* Wavy frame behind everything */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
      repeating-linear-gradient(
        45deg,
        #ffe066 0px,
        #ffe066 10px,
        #ff6b6b 10px,
        #ff6b6b 20px,
        #6bcf6b 20px,
        #6bcf6b 30px
      );
    opacity: 0.2;
    z-index: 1;
    pointer-events: none;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
    margin: 20px;
  }

  h1 { font-size: clamp(28px, 8vw, 50px); }
  p { font-size: clamp(18px, 5vw, 30px); }

  .heart {
    position: absolute;
    color: white;
    opacity: 0;
    user-select: none;
    pointer-events: none;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 55%; /* bouquet lower on the screen */
    transform: translate(-50%, -50%) scale(0.5); /* starting smaller and centered */
    opacity: 0;
    transition: transform 1.5s ease, opacity 1.5s ease;
    z-index: 5;
    width: 400px;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png">

<script>
const numHearts = 50;
const hearts = [];
let forming = false;

// starting grid positions
const cols = Math.ceil(Math.sqrt(numHearts));
const rows = Math.ceil(numHearts / cols);
const cellW = window.innerWidth / cols;
const cellH = window.innerHeight / rows;

// create hearts
for(let i=0; i<numHearts; i++){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";
  document.body.appendChild(heart);

  const col = i % cols;
  const row = Math.floor(i / cols);

  heart.style.left = (col * cellW + cellW / 2) + "px";
  heart.style.top = (row * cellH + cellH / 2) + "px";

  heart.blinkSpeed = 0.005 + Math.random() * 0.01;
  heart.phase = Math.random();
  heart.style.fontSize = (15 + Math.random() * 25) + "px";

  hearts.push(heart);
}

// animation
function animate() {
  hearts.forEach(h => {
    if (forming) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      const x = parseFloat(h.style.left);
      const y = parseFloat(h.style.top);

      h.style.left = x + (cx - x) * 0.06 + "px";
      h.style.top = y + (cy - y) * 0.06 + "px";
      h.style.opacity = 1;
      return;
    }

    h.phase += h.blinkSpeed;

    if (h.phase >= 1) {
      h.style.left = Math.random() * window.innerWidth + "px";
      h.style.top = Math.random() * window.innerHeight + "px";
      h.phase = 0;
    }

    h.style.opacity = Math.sin(h.phase * Math.PI);
  });

  requestAnimationFrame(animate);
}
animate();

// click trigger
document.addEventListener("click", () => {
  if (forming) return;
  forming = true;

  setTimeout(() => {
    const bouquet = document.getElementById("bouquet");
    bouquet.style.opacity = 1;
    bouquet.style.transform = "translate(-50%, -50%) scale(1)";
  }, 900);
});
</script>

</body>
</html>
