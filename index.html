<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
    margin: 20px;
  }

  h1 { font-size: clamp(28px, 8vw, 50px); }
  p { font-size: clamp(18px, 5vw, 30px); }

  .heart {
    position: absolute;
    color: white;
    opacity: 0;
    user-select: none;
    pointer-events: none;
    transition: opacity 0.3s ease;
    will-change: left, top, opacity;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    transition: transform 1.5s ease, opacity 1.5s ease;
    z-index: 5;
    width: 400px;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png">

<script>
const numHearts = 100;  // Increased number of hearts
const hearts = [];
const heartPositions = []; // to store positions and sizes for overlap checking
let forming = false;

// Helper function to check if two hearts overlap
function isOverlapping(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2;
  const dy = y1 - y2;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < r1 + r2; // overlap if distance less than sum of radii
}

// Try to find a random position that does NOT overlap existing hearts
function getNonOverlappingPosition(radius) {
  const maxAttempts = 200;
  let attempt = 0;
  while (attempt < maxAttempts) {
    // Generate random position inside viewport boundaries, leaving margin for radius
    const x = Math.random() * (window.innerWidth - 2 * radius) + radius;
    const y = Math.random() * (window.innerHeight - 2 * radius) + radius;

    // Check overlap with existing hearts
    let overlap = false;
    for (const pos of heartPositions) {
      if (isOverlapping(x, y, radius, pos.x, pos.y, pos.radius)) {
        overlap = true;
        break;
      }
    }

    if (!overlap) {
      return { x, y };
    }
    attempt++;
  }
  // If failed to find position, return null (no place)
  return null;
}

// create hearts with non-overlapping positions
for(let i = 0; i < numHearts; i++) {
  // Create heart element
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";

  // Random size for heart radius (half font-size), font size from 15 to 40px approx
  const fontSize = 15 + Math.random() * 25;
  heart.style.fontSize = fontSize + "px";
  const radius = fontSize * 0.6; // approximate radius (adjust factor if needed)

  // Find a good position for this heart
  const pos = getNonOverlappingPosition(radius);
  if (!pos) {
    // No suitable position found, skip this heart to avoid overlap
    continue;
  }

  // Set position
  heart.style.left = pos.x + "px";
  heart.style.top = pos.y + "px";

  // Store position & radius for future overlap checks
  heartPositions.push({ x: pos.x, y: pos.y, radius });

  // Initial opacity and other properties
  heart.style.opacity = 0;
  heart.blinkSpeed = 0.005 + Math.random() * 0.01;
  heart.phase = Math.random();

  document.body.appendChild(heart);
  hearts.push(heart);
}

// animation
function animate() {
  hearts.forEach(h => {
    if (forming) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      const x = parseFloat(h.style.left);
      const y = parseFloat(h.style.top);

      h.style.left = x + (cx - x) * 0.06 + "px";
      h.style.top = y + (cy - y) * 0.06 + "px";
      h.style.opacity = 1;
      return;
    }

    h.phase += h.blinkSpeed;

    if (h.phase >= 1) {
      // When not forming, hearts randomly reposition anywhere (but now no overlap)
      // For simplicity, here we skip reposition on phase reset to keep no-overlap

      h.phase = 0;
    }

    h.style.opacity = Math.sin(h.phase * Math.PI);
  });

  requestAnimationFrame(animate);
}
animate();

// click trigger
document.addEventListener("click", () => {
  if (forming) return;
  forming = true;

  setTimeout(() => {
    const bouquet = document.getElementById("bouquet");
    bouquet.style.opacity = 1;
    bouquet.style.transform = "translate(-50%, -50%) scale(1)";
  }, 900);
});
</script>

</body>
</html>
