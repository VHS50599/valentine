<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
    margin: 20px;
  }

  h1 { font-size: clamp(28px, 8vw, 50px); }
  p { font-size: clamp(18px, 5vw, 30px); }

  .heart {
    position: absolute;
    color: white;
    user-select: none;
    pointer-events: none;
    transition: opacity 0.3s ease, left 0.5s ease, top 0.5s ease;
    will-change: left, top, opacity;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    transition: transform 1.5s ease, opacity 1.5s ease;
    z-index: 5;
    width: 400px;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png" alt="Bouquet">

<script>
const numHearts = 100;  // number of hearts
const hearts = [];
const heartPositions = []; // stores {x, y, radius} for each heart to check overlap
let forming = false;

// Check overlap between two circles
function isOverlapping(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2;
  const dy = y1 - y2;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < r1 + r2;
}

// Find a random non-overlapping position for a heart
function getNonOverlappingPosition(radius) {
  const maxAttempts = 200;
  let attempt = 0;
  while (attempt < maxAttempts) {
    const x = Math.random() * (window.innerWidth - 2 * radius) + radius;
    const y = Math.random() * (window.innerHeight - 2 * radius) + radius;

    let overlap = false;
    for (const pos of heartPositions) {
      if (isOverlapping(x, y, radius, pos.x, pos.y, pos.radius)) {
        overlap = true;
        break;
      }
    }
    if (!overlap) return { x, y };
    attempt++;
  }
  return null;
}

// Update stored position for heart index
function updateHeartPosition(index, x, y, radius) {
  heartPositions[index] = { x, y, radius };
}

// Create hearts initially with non-overlapping positions
for(let i = 0; i < numHearts; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";

  // Random size and radius
  const fontSize = 15 + Math.random() * 25;
  heart.style.fontSize = fontSize + "px";
  const radius = fontSize * 0.6;

  const pos = getNonOverlappingPosition(radius);
  if (!pos) {
    // No room found for this heart, skip
    continue;
  }

  heart.style.left = pos.x + "px";
  heart.style.top = pos.y + "px";

  heartPositions.push({ x: pos.x, y: pos.y, radius });

  heart.style.opacity = 0;
  heart.blinkSpeed = 0.005 + Math.random() * 0.01;
  heart.phase = Math.random();

  document.body.appendChild(heart);
  hearts.push(heart);
}

function animate() {
  hearts.forEach((h, i) => {
    if (forming) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      const x = parseFloat(h.style.left);
      const y = parseFloat(h.style.top);

      h.style.left = x + (cx - x) * 0.06 + "px";
      h.style.top = y + (cy - y) * 0.06 + "px";
      h.style.opacity = 1;
      return;
    }

    h.phase += h.blinkSpeed;

    if (h.phase >= 1) {
      // Move heart to new non-overlapping position smoothly
      const radius = heartPositions[i].radius;
      let newPos = null;
      let attempts = 0;
      const maxAttempts = 200;

      while (attempts < maxAttempts) {
        const x = Math.random() * (window.innerWidth - 2 * radius) + radius;
        const y = Math.random() * (window.innerHeight - 2 * radius) + radius;

        let overlap = false;
        for (let j = 0; j < heartPositions.length; j++) {
          if (j === i) continue;
          if (isOverlapping(x, y, radius, heartPositions[j].x, heartPositions[j].y, heartPositions[j].radius)) {
            overlap = true;
            break;
          }
        }

        if (!overlap) {
          newPos = { x, y };
          break;
        }
        attempts++;
      }

      if (newPos) {
        h.style.left = newPos.x + "px";
        h.style.top = newPos.y + "px";
        updateHeartPosition(i, newPos.x, newPos.y, radius);
      }
      h.phase = 0;
    }

    h.style.opacity = Math.sin(h.phase * Math.PI);
  });

  requestAnimationFrame(animate);
}
animate();

document.addEventListener("click", () => {
  if (forming) return;
  forming = true;

  setTimeout(() => {
    const bouquet = document.getElementById("bouquet");
    bouquet.style.opacity = 1;
    bouquet.style.transform = "translate(-50%, -50%) scale(1)";
  }, 900);
});
</script>

</body>
</html>
