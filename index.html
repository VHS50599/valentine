<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin-top: 100px;
    font-family: Arial;
    overflow: hidden;
    position: relative;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
  }

  h1 {
  font-size: clamp(28px, 8vw, 50px);
}

p {
  font-size: clamp(18px, 5vw, 30px);
}


  /* Mobile adjustments */


  .heart {
    position: absolute;
    color: white;
    font-size: 20px;
    opacity: 0;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín ❤️</h1>
<p>Eres lo más importante que tengo.</p>

<script>
  const numHearts = 50;
  const hearts = [];

  for(let i = 0; i < numHearts; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤';
    document.body.appendChild(heart);

    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = Math.random() * window.innerHeight + 'px';
    const size = 10 + Math.random() * 30;
    heart.style.fontSize = size + 'px';
    heart.blinkSpeed = 0.005 + Math.random() * 0.01;
    heart.phase = Math.random();
    hearts.push(heart);
  }

  function animateHearts() {
    hearts.forEach(heart => {
      heart.phase += heart.blinkSpeed;
      if(heart.phase >= 1) {
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.top = Math.random() * window.innerHeight + 'px';
        const size = 10 + Math.random() * 30;
        heart.style.fontSize = size + 'px';
        heart.phase = 0;
      }
      heart.style.opacity = Math.sin(heart.phase * Math.PI);
    });

    requestAnimationFrame(animateHearts);
  }

  animateHearts();
</script>

</body>
</html>
