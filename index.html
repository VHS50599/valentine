<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin-top: 100px;
    font-family: Arial;
    overflow: hidden;
    position: relative;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
  }

  h1 {
    font-size: clamp(28px, 8vw, 50px);
  }

  p {
    font-size: clamp(18px, 5vw, 30px);
  }

  .heart {
    position: absolute;
    color: white;
    font-size: 20px;
    opacity: 0;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<script>
const numHearts = 50;
const hearts = [];
let bouquetMode = false;
let bouquetTargets = [];

// grid layout start positions
const cols = Math.ceil(Math.sqrt(numHearts));
const rows = Math.ceil(numHearts / cols);
const cellW = window.innerWidth / cols;
const cellH = window.innerHeight / rows;

// create hearts
for(let i = 0; i < numHearts; i++) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = '\u2764\uFE0E';
  document.body.appendChild(heart);

  const col = i % cols;
  const row = Math.floor(i / cols);

  heart.style.left = (col * cellW + cellW/2) + 'px';
  heart.style.top = (row * cellH + cellH/2) + 'px';

  const size = 15 + Math.random() * 25;
  heart.style.fontSize = size + 'px';
  heart.blinkSpeed = 0.005 + Math.random() * 0.01;
  heart.phase = Math.random();

  hearts.push(heart);
}

// bouquet shape targets
const centerX = window.innerWidth / 2;
const centerY = window.innerHeight / 2;

for(let i = 0; i < numHearts; i++){
  let x = centerX;
  let y = centerY;

  if(i < numHearts * 0.7){
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 120;
    x += Math.cos(angle) * radius;
    y += Math.sin(angle) * radius - 100;
  }
  else{
    x += (Math.random() - 0.5) * 40;
    y += 100 + Math.random() * 120;
  }

  bouquetTargets.push({x,y});
}

// animation loop
function animateHearts() {
  hearts.forEach((heart,i) => {

    if(bouquetMode){
      const target = bouquetTargets[i];
      const currentX = parseFloat(heart.style.left);
      const currentY = parseFloat(heart.style.top);

      heart.style.left = currentX + (target.x - currentX) * 0.05 + "px";
      heart.style.top = currentY + (target.y - currentY) * 0.05 + "px";
      heart.style.opacity = 1;
      return;
    }

    heart.phase += heart.blinkSpeed;

    if(heart.phase >= 1){
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.top = Math.random() * window.innerHeight + 'px';
      heart.phase = 0;
    }

    heart.style.opacity = Math.sin(heart.phase * Math.PI);
  });

  requestAnimationFrame(animateHearts);
}

animateHearts();

// trigger bouquet mode after 4 seconds
setTimeout(()=>{
  bouquetMode = true;
},4000);

</script>

</body>
</html>
