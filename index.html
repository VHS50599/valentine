<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin-top: 100px;
    font-family: Arial;
    overflow: hidden;
    position: relative;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
  }

  h1 { font-size: clamp(28px, 8vw, 50px); }
  p { font-size: clamp(18px, 5vw, 30px); }

  .heart {
    position: absolute;
    color: white;
    opacity: 0;
    user-select: none;
    pointer-events: none;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 50%;               /* center of the screen */
    transform: translate(-50%, -80%) scale(0.5); /* shift slightly up less, so it sits lower */
    opacity: 0;
    transition: 1.5s ease;
    z-index: 5;
    width: 220px;
}
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png">

<script>
const numHearts = 50;
const hearts = [];
let forming = false;

// starting grid positions
const cols = Math.ceil(Math.sqrt(numHearts));
const rows = Math.ceil(numHearts / cols);
const cellW = window.innerWidth / cols;
const cellH = window.innerHeight / rows;

// create hearts
for(let i=0;i<numHearts;i++){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="\u2764\uFE0E";
  document.body.appendChild(heart);

  const col=i%cols;
  const row=Math.floor(i/cols);

  heart.style.left=(col*cellW+cellW/2)+"px";
  heart.style.top=(row*cellH+cellH/2)+"px";

  heart.blinkSpeed=0.005+Math.random()*0.01;
  heart.phase=Math.random();
  heart.style.fontSize=(15+Math.random()*25)+"px";

  hearts.push(heart);
}

// animation
function animate(){
  hearts.forEach(h=>{

    if(forming){
      const cx=window.innerWidth/2;
      const cy=window.innerHeight/2;

      const x=parseFloat(h.style.left);
      const y=parseFloat(h.style.top);

      h.style.left=x+(cx-x)*0.06+"px";
      h.style.top=y+(cy-y)*0.06+"px";
      h.style.opacity=1;
      return;
    }

    h.phase+=h.blinkSpeed;

    if(h.phase>=1){
      h.style.left=Math.random()*window.innerWidth+"px";
      h.style.top=Math.random()*window.innerHeight+"px";
      h.phase=0;
    }

    h.style.opacity=Math.sin(h.phase*Math.PI);
  });

  requestAnimationFrame(animate);
}
animate();

// tap trigger
document.addEventListener("click",()=>{
  if(forming) return;
  forming=true;

  setTimeout(()=>{
    document.getElementById("bouquet").style.opacity=1;
    document.getElementById("bouquet").style.transform="translate(-50%, -50%) scale(1)";
  },900);
});
</script>

</body>
</html>
