<!DOCTYPE html>
<html>
<head>
<title>Para Mi Monita Hermosa ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #b180f0;
    text-align: center;
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }

  h1, p {
    color: white;
    z-index: 10;
    position: relative;
    margin: 20px;
  }

  h1 { font-size: clamp(28px, 8vw, 50px); }
  p { font-size: clamp(18px, 5vw, 30px); }

  .heart {
    position: absolute;
    color: white;
    user-select: none;
    pointer-events: none;
    opacity: 0;
  }

  #bouquet {
    position: fixed;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    transition: transform 1.5s ease, opacity 1.5s ease;
    z-index: 5;
    width: 400px;
  }
</style>
</head>
<body>

<h1>Feliz Día De San Valentín</h1>
<p>Eres lo más importante que tengo.</p>

<img id="bouquet" src="bouquet.png" alt="Bouquet">

<script>
const numHearts = 100;
const hearts = [];
const heartPositions = [];
const heartSizes = [];
let forming = false;

// Check overlap between two circles
function isOverlapping(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2;
  const dy = y1 - y2;
  const distance = Math.sqrt(dx*dx + dy*dy);
  return distance < r1 + r2;
}

// Find random non-overlapping position
function getNonOverlappingPosition(radius) {
  const maxAttempts = 200;
  let attempt = 0;
  while (attempt < maxAttempts) {
    const x = Math.random() * (window.innerWidth - 2*radius) + radius;
    const y = Math.random() * (window.innerHeight - 2*radius) + radius;

    let overlap = false;
    for (let i=0; i<heartPositions.length; i++) {
      if (isOverlapping(x, y, radius, heartPositions[i].x, heartPositions[i].y, heartSizes[i])) {
        overlap = true;
        break;
      }
    }

    if (!overlap) return { x, y };
    attempt++;
  }
  return null;
}

// Create hearts initially (positions don’t matter since they’ll start invisible)
for(let i=0; i<numHearts; i++){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "\u2764\uFE0E";
  
  const fontSize = 15 + Math.random() * 25;
  heart.style.fontSize = fontSize + "px";
  const radius = fontSize * 0.6;

  document.body.appendChild(heart);
  hearts.push(heart);
  heartSizes.push(radius);
  heartPositions.push({ x: 0, y: 0 }); // placeholder
}

// Function to make hearts appear at random non-overlapping positions
function popHearts() {
  hearts.forEach((heart, i) => {
    heart.style.opacity = 0; // start invisible

    setTimeout(() => {
      const pos = getNonOverlappingPosition(heartSizes[i]);
      if (pos) {
        heart.style.left = pos.x + "px";
        heart.style.top = pos.y + "px";
        heartPositions[i] = { x: pos.x, y: pos.y };
        heart.style.opacity = 1;

        // After a short visible time, disappear again
        setTimeout(() => {
          heart.style.opacity = 0;
        }, 800 + Math.random()*700); // visible 0.8–1.5s
      }
    }, Math.random() * 3000); // stagger appearance times
  });
}

// Continuously repeat the popHearts function
function animateHearts() {
  popHearts();
  setTimeout(animateHearts, 2000); // run again every 2 seconds
}
animateHearts();

// Click to show bouquet
document.addEventListener("click", () => {
  if (forming) return;
  forming = true;

  setTimeout(() => {
    const bouquet = document.getElementById("bouquet");
    bouquet.style.opacity = 1;
    bouquet.style.transform = "translate(-50%, -50%) scale(1)";
  }, 900);
});
</script>

</body>
</html>
